steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --build-arg NEXT_PUBLIC_SUPABASE_URL=$$NEXT_PUBLIC_SUPABASE_URL \
          --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY=$$NEXT_PUBLIC_SUPABASE_ANON_KEY \
          -t us-central1-docker.pkg.dev/domainvault-497310/domainvault/domainvault:$SHORT_SHA \
          -t us-central1-docker.pkg.dev/domainvault-497310/domainvault/domainvault:latest \
          -f infra/Dockerfile \
          .
    secretEnv:
      - 'NEXT_PUBLIC_SUPABASE_URL'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY'

  # Step 2: Push both tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'us-central1-docker.pkg.dev/domainvault-497310/domainvault/domainvault'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - services
      - update
      - domainvault
      - --image=us-central1-docker.pkg.dev/domainvault-497310/domainvault/domainvault:$SHORT_SHA
      - --region=us-central1
      - --project=domainvault-497310

availableSecrets:
  secretManager:
    - versionName: projects/domainvault-497310/secrets/NEXT_PUBLIC_SUPABASE_URL/versions/latest
      env: 'NEXT_PUBLIC_SUPABASE_URL'
    - versionName: projects/domainvault-497310/secrets/NEXT_PUBLIC_SUPABASE_ANON_KEY/versions/latest
      env: 'NEXT_PUBLIC_SUPABASE_ANON_KEY'


options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'