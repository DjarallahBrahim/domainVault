# Pull image, write compose, start
- name: Create clawbot directory
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    mode: "0755"

- name: Deploy docker-compose.yml
  template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ app_user }}"
    mode: "0644"

- name: Pull and start Clawbot
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    state: present
    pull: always