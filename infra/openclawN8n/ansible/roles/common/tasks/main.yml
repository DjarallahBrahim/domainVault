- name: Update apt cache
  become: true
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install prerequisites
  become: true
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - ufw
      - python3-pip
    state: present

- name: Create keyrings directory
  become: true
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker GPG key
  become: true
  shell: |
    curl -fsSL https://download.docker.com/linux/debian/gpg | \
    gpg --dearmor -o /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Add Docker repository (Debian 12)
  become: true
  apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/debian bookworm stable"
    filename: docker
    state: present

- name: Update apt cache after adding Docker repo
  become: true
  apt:
    update_cache: yes

- name: Ensure Docker fully installed
  become: true
  apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes
    force_apt_get: yes

- name: Enable and start Docker
  service:
    name: docker
    state: started
    enabled: yes

- name: Add user to docker group
  user:
    name: "{{ app_user }}"
    groups: docker
    append: yes

- name: Allow SSH (UFW)
  ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Allow HTTP (UFW)
  ufw:
    rule: allow
    port: "80"
    proto: tcp

- name: Allow HTTPS (UFW)
  ufw:
    rule: allow
    port: "443"
    proto: tcp

- name: Allow app port (UFW)
  ufw:
    rule: allow
    port: "{{ app_port | string }}"
    proto: tcp

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny